[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instantwiki-markitdown-service"
version = "1.0.0"
description = "Self-contained Python microservice for document-to-markdown conversion"
requires-python = ">=3.10"
dependencies = [
  # Web server
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",

  # Core markitdown (installed as editable from ./packages/markitdown)
  # markitdown @ file:./packages/markitdown

  # OCR plugin (installed as editable from ./packages/markitdown-ocr)
  # markitdown-ocr @ file:./packages/markitdown-ocr

  # PDF extraction
  "PyMuPDF>=1.24.0",
  "pdfminer.six>=20251230",
  "pdfplumber>=0.11.9",

  # LLM client
  "openai>=1.0.0",

  # Env loading
  "python-dotenv>=1.0.0",
]

[project.scripts]
markitdown-service = "server:main"
